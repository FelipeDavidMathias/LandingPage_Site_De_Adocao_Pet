<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>AdoPetz</title>
</head>

<body>

    <header> <!--Cabeçalho-->
        <div class="container">
            <div class="logo">
                <img src="Images/Logo.png" alt="Logo do site">
            </div>
            <nav class="nav"> <!--Navegação do Cabeçalho-->
                <ul>
                    <li><a href="#"></a> Adoção</li>
                    <li><a href="#"></a> Dicas</li>
                    <li><a href="#"></a> Sobre</li>
                </ul>
            </nav>
        </div>
    </header>

    <main class='main'> <!--Parte Principal do Site-->
        <div class="container">
            <div class="slider"> <!--Carrossel Começo-->
                <input type="radio" name="btn-radio" id="radio1">
                <input type="radio" name="btn-radio" id="radio2">
                <input type="radio" name="btn-radio" id="radio3">
                <input type="radio" name="btn-radio" id="radio4">
                <div class="mainbanner SlideOne">
                    <img src="Images/Carrossel1.jpg" alt="Imagem de Cachorro">
                </div>
                <div class="mainbanner SlideTwo">
                    <img src="Images/Carrossel3.jpg" alt="Imagem de Gato">
                </div>
                <div class="mainbanner SlideThree">
                    <img src="Images/Carrossel2.jpg" alt="Imagem de Cachorro">
                </div>
                <div class="mainbanner SlideFour">
                    <img src="Images/Carrossel4.png" alt="Imagem de Gato">
                </div>

                <div class="nav-auto">
                    <div class="botao-auto1"></div>
                    <div class="botao-auto2"></div>
                    <div class="botao-auto3"></div>
                    <div class="botao-auto4"></div>
                </div>

                <div class="nav-manual">
                    <label for="radio1" class="botao-manual"></label>
                    <label for="radio2" class="botao-manual"></label>
                    <label for="radio3" class="botao-manual"></label>
                    <label for="radio4" class="botao-manual"></label>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
